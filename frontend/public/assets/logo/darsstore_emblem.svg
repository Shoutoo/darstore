<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec8f2" />
      <stop offset="50%" stop-color="#0080cc" />
      <stop offset="100%" stop-color="#005285" />
    </linearGradient>
    <linearGradient id="emblemCyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006199" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="emblemSubtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#006199" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(80, 80)" filter="url(#emblemSubtleShadow)">
    <!-- Outer/Left Curve Arch resembling a dynamic D / portal blade -->
    <path d="M-42,-70 C-10,-70 25,-40 25,-10 C25,12 12,28 -5,35 C-12,38 -20,40 -30,40 C-48,40 -60,25 -60,5 C-60,-22 -55,-48 -42,-70 Z" 
          fill="url(#emblemBlueGlow)" />
    
    <!-- Inner Counter-Curve Swirl representing S / continuous energy flow -->
    <path d="M42,70 C10,70 -25,40 -25,10 C-25,-12 -12,-28 5,-35 C12,-38 20,-40 30,-40 C48,-40 60,-25 60,-5 C60,22 55,48 42,70 Z" 
          fill="url(#emblemCyanAccent)" />
    
    <!-- Center Core Emblem Sparkle / Diamond -->
    <polygon points="0,-16 12,0 0,16 -12,0" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
