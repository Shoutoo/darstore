services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darstore-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persistent storage for SQLite database (if not using cloud PostgreSQL/Supabase)
      - darstore_data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  darstore_data:
    driver: local
